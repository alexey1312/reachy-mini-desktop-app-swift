included:
  - Sources
  - Tests
  - Apps
excluded:
  - .build
  - Sources/ReachyKit/Generated
  - Apps/Derived
  - Apps/DerivedData

disabled_rules:
  - trailing_comma
  - todo
  - opening_brace
  - superfluous_disable_command
  - blanket_disable_command
  - trailing_whitespace # handled by swiftformat

opt_in_rules:
  - empty_count
  - empty_string

line_length:
  warning: 120
  error: 200
  ignores_comments: true

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 800

nesting:
  type_level: 4

identifier_name:
  min_length:
    warning: 1
