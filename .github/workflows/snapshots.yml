name: Snapshots

# The preview and reference images, which the main CI workflow cannot see at all:
# both of its app-build steps build `-scheme ReachySpike`, whose sources are
# `ReachySpike/Sources/**`, while `Sources/*/Previews/**` is compiled only by the
# ReachyStorybook and ReachyUISnapshotTests targets. A broken preview therefore went
# green until someone ran the snapshots on a Mac.
#
# `record` writes to the repository, so it is dispatch-only — never a push or a label.
# A push made with GITHUB_TOKEN does not trigger workflows, so it cannot loop either.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify compares against the committed references; record deletes and rewrites them, then commits"
        type: choice
        default: verify
        options: [verify, record]
  pull_request:
    branches: ["main"]
    # Everything that can move a reference. A ReachyKit-only change cannot, and
    # should not pay for a macOS runner.
    paths:
      - "Sources/ReachyUI/**"
      - "Sources/ReachyDesign/**"
      - "Sources/ReachyWidgetUI/**"
      - "Apps/**"
      - ".github/workflows/snapshots.yml"
      - "mise.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_GITHUB_GITHUB_ATTESTATIONS: false
  SNAPSHOT_DIR: Apps/ReachyUISnapshotTests/__Snapshots__

jobs:
  snapshots:
    name: Snapshots (${{ inputs.mode || 'verify' }})
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      # `record` commits the rewritten references back to the branch it ran on.
      contents: write
    env:
      # Deliberately Xcode's own Swift with no swift.org toolchain overlaid, for the
      # reason the app-build job gives: xcodebuild cannot load the local package's
      # manifest under one.
      DEVELOPER_DIR: "/Applications/Xcode_26.2.app/Contents/Developer"
      # The runtime is what draws every pixel, so this is the pin the references
      # belong to. 26.2 is the newest the macos-15 image carries — see
      # `snapshots:_run` in mise.toml, which refuses to run on anything else.
      REACHY_SNAPSHOT_OS: "26.2"
      REACHY_SNAPSHOT_SIM: "iPhone 17 Pro"
      MODE: ${{ inputs.mode || 'verify' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Without this the references check out as text pointers and every
          # comparison fails against a file that is not an image.
          lfs: true

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show the pinned environment
        run: |
          xcodebuild -version
          echo "Runtime pin: iOS ${REACHY_SNAPSHOT_OS} on ${REACHY_SNAPSHOT_SIM}"
          xcrun simctl list runtimes | grep "iOS" || true

      # Through the mise task, not a copy of its commands: GitHub runs `run:` under
      # `bash -e` without pipefail, so a piped `xcodebuild … | xcsift` would report
      # xcsift's exit 0 and a failed run would land as a green job.
      - name: Verify references
        if: env.MODE != 'record'
        run: ./bin/mise run test:snapshots

      - name: Re-record references
        if: env.MODE == 'record'
        run: ./bin/mise run test:snapshots:record

      - name: Summarise what moved
        if: env.MODE == 'record'
        run: |
          count=$(git status --porcelain --untracked-files=all -- "$SNAPSHOT_DIR" | wc -l | tr -d ' ' || true)
          {
            echo "## Recorded on iOS ${REACHY_SNAPSHOT_OS} / ${REACHY_SNAPSHOT_SIM}"
            echo
            echo "References changed: **${count}**"
            echo
            echo "<details><summary>By suite</summary>"
            echo
            echo '```'
            git status --porcelain --untracked-files=all -- "$SNAPSHOT_DIR" \
              | cut -c4- | xargs -I{} dirname {} | sort | uniq -c | sort -rn
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push the references
        if: env.MODE == 'record'
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- "$SNAPSHOT_DIR")" ]; then
            echo "Every reference already matched; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git add -- "$SNAPSHOT_DIR"
          git commit \
            -m "chore(snapshots): re-record references on the CI-pinned runtime" \
            -m "Recorded on iOS ${REACHY_SNAPSHOT_OS} / ${REACHY_SNAPSHOT_SIM}." \
            -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Upload the LFS objects explicitly rather than trusting a pre-push hook:
          # `core.hooksPath` points at `.githooks/` only once mise's enter hook has run,
          # and a push without the objects leaves pointers with nothing behind them.
          git lfs push origin HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # A verify failure is the interesting one, and the reference alone does not
      # explain it. swift-snapshot-testing attaches the expected/actual pair to the
      # xcresult; a reference that was simply missing shows up as a written file.
      - name: Collect failure evidence
        if: failure() && env.MODE != 'record'
        run: |
          out=/tmp/snapshot-failures
          mkdir -p "$out"
          git status --porcelain --untracked-files=all -- "$SNAPSHOT_DIR" | cut -c4- > "$out/changed.txt" || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            mkdir -p "$out/written/$(dirname "$f")"
            cp "$f" "$out/written/$f"
          done < "$out/changed.txt"
          cp -R Apps/DerivedData/Logs/Test "$out/xcresult" 2>/dev/null || true
          {
            echo "## Snapshot verification failed"
            echo
            echo "References that had to be written (missing, so they verified nothing):"
            echo
            echo '```'
            cat "$out/changed.txt"
            echo '```'
            echo
            echo "Re-record with the **record** mode of this workflow, then review the diff."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure() && env.MODE != 'record'
        with:
          name: snapshot-failures
          path: /tmp/snapshot-failures
          retention-days: 7
